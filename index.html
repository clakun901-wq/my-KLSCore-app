<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Kalsara | Micro-ERP Skala 1.000+ Produk</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Dexie.js untuk IndexedDB-First Architecture (Menghindari batasan 5MB localStorage) -->
    <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>
    <script type="module" src="js/app.js"></script>
</head>
<body>
    <header>
        <div class="header-top">
            <div class="brand-group">
                <div class="av">K</div>
                <div>
                    <div class="brand">Kalsara</div>
                    <p class="pwa">Progressive Web App (1.000+ Produk)</p>
                </div>
            </div>
            <button class="thm" id="thm" type="button" aria-label="Ubah Tema">🌓</button>
        </div>
        <div class="header-sub">
            <div id="etad-title">Etalase toko</div>
            <button class="btn-guide" id="btn-guide" type="button">📖 Panduan</button>
        </div>
        <div class="date-status-bar">
            <span id="current-date">Senin, 2 November 2026</span>
            <span class="status-pill" id="stock-status-pill">50 produk live, 1 perlu isi ulang</span>
        </div>
    </header>
    
    <main id="app-root">
        <!-- Bagian Collapsible Keterangan ERP -->
        <details class="keterangan-box">
            <summary>Keterangan ▾</summary>
            <p>Sistem Micro-ERP Client-Side aktif. Menggunakan IndexedDB & Virtual Scrolling untuk performa optimal tanpa lag pada 1.000+ produk.</p>
        </details>

        <!-- Kategori / Filter -->
        <div class="section-header">
            <h3>PERLU ISI ULANG (1)</h3>
        </div>
        <div id="urgent-list" class="product-container"></div>

        <div class="section-header" style="margin-top: 24px;">
            <h3 id="stok-aman-title">STOK AMAN (49)</h3>
        </div>
        
        <!-- Virtual Scrolling Viewport untuk Menangani 1.000+ Produk Tanpa Lag -->
        <div id="virtual-scroll-viewport" class="virtual-viewport">
            <div id="virtual-scroll-spacer"></div>
            <div id="product-list" class="product-container"></div>
        </div>
    </main>
    
    <!-- Floating Action Button (FAB) Khas v5.82 -->
    <button id="fab-add" class="fab" type="button" aria-label="Tambah Produk">+</button>

    <!-- Bottom Navigation Khas v5.82 -->
    <nav role="tablist" aria-label="Menu utama">
        <button type="button" class="tab active" role="tab" data-target="etalase">
            <span class="tab-icon">🏠</span> Etalase
        </button>
        <button type="button" class="tab" role="tab" data-target="hitung">
            <span class="tab-icon">🧮</span> Hitung
        </button>
        <button type="button" class="tab" role="tab" data-target="promosi">
            <span class="tab-icon">🏷️</span> Promosi
        </button>
        <button type="button" class="tab" role="tab" data-target="laporan">
            <span class="tab-icon">📊</span> Laporan
        </button>
        <button type="button" class="tab" role="tab" data-target="tarif">
            <span class="tab-icon">⚖️</span> Tarif
        </button>
        <button type="button" class="tab" role="tab" data-target="erp">
            <span class="tab-icon">📦</span> ERP
        </button>
        <button type="button" class="tab" role="tab" data-target="setelan">
            <span class="tab-icon">⚙️</span> Setelan
        </button>
    </nav>
</body>
</html>
