<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Kalsara | Micro-ERP</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="importmap">
      {
        "imports": {
          "@preact/signals-core": "https://esm.sh/@preact/signals-core"
        }
      }
    </script>
    <script type="module" src="js/app.js"></script>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="av">K</div>
            <div class="brand-text">
                <div class="brand">Kalsara</div>
                <p class="pwa">OPFS Engine Aktif</p>
            </div>
            <button class="thm" id="thm" type="button" aria-label="Ubah Tema">🌙</button>
        </div>
    </header>
    
    <main id="app-root">
        <!-- Floating Action Button for Adding Data -->
        <button id="btn-add-product" class="fab" type="button" disabled>+</button>
        
        <div class="section-title">
            <h2>Katalog Produk</h2>
            <span id="db-status" class="badge warning">DB Connecting...</span>
        </div>
        
        <!-- Native Web Components Container -->
        <div id="product-list" role="list"></div>
    </main>
    
    <!-- Kalsara v5.82 Bottom Navigation -->
    <nav role="tablist" aria-label="Menu utama">
        <button type="button" class="tab active" role="tab">Beranda</button>
        <button type="button" class="tab" role="tab">Kalkulator</button>
        <button type="button" class="tab" role="tab">Pengaturan</button>
    </nav>
</body>
</html>
