<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Kalsara | OPFS + SQLite Architecture</title>
    <link rel="stylesheet" href="css/style.css">
    
    <!-- ES6 Module Import Maps for Signals -->
    <script type="importmap">
      {
        "imports": {
          "@preact/signals-core": "https://esm.sh/@preact/signals-core"
        }
      }
    </script>
    
    <!-- Main Entry -->
    <script type="module" src="js/app.js"></script>
</head>
<body>
    <header>
        <div class="brand-container">
            <div class="av">K</div>
            <div>
                <h1 class="brand">Kalsara Core</h1>
                <p class="pwa">100% Client-Side | OPFS SQLite | Native Web Components</p>
            </div>
        </div>
    </header>
    
    <main id="app-root">
        <section class="controls">
            <button id="btn-init-db" type="button">1. Init OPFS Database</button>
            <button id="btn-add-product" type="button" disabled>2. + Tambah Produk (Simulasi Pipeline)</button>
        </section>
        
        <section>
            <h2>Katalog Produk</h2>
            <!-- Wadah list produk tanpa innerHTML -->
            <div id="product-list" role="list"></div>
        </section>
    </main>
</body>
</html>
