name: Siapkan mesin SQLite

# Dijalankan MANUAL: buka tab "Actions" di GitHub, pilih "Siapkan mesin SQLite",
# lalu klik "Run workflow". Tidak berjalan sendiri.
on:
  workflow_dispatch:

permissions:
  contents: write   # agar hasil unduhan bisa disimpan ke repo

jobs:
  siapkan:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil isi repo
        uses: actions/checkout@v4

      - name: Pasang Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unduh mesin SQLite
        run: npm run vendor:sqlite

      - name: Periksa berkas utuh
        run: npm run vendor:check

      - name: Jalankan seluruh pengujian
        run: npm test

      - name: Simpan hasil ke repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/sqlite-wasm
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan, berkas sudah ada di repo."
          else
            git commit -m "Tambah mesin SQLite Wasm lokal (vendor/sqlite-wasm)"
            git push
          fi
